apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: openjdk-21          # matches SpringBootApplication spec.javaVersion: "21"
  dockerfile: ./Dockerfile   # whole build lives in the scaffolded multi-stage
                              # Dockerfile (mvn package -> JRE runtime stage) - no
                              # build.script

ephemeralEnvironments:
  pullRequest:
    enabled: true
  ttl: 5d

governance:
  sast: false
  imageScan: false
  policyCheck: false
  sbom: false
  allowedCommitSigners:
    - crossfader@gmail.com
    - 7268337+jfillman@users.noreply.github.com

secrets:
  - name: slack-webhook-url

notifications:
  slack:
    enabled: true
    channel: "#all-idp-lab"

deploy:
  lowerEnvironments: [dev]

pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: deploy
        env: dev
