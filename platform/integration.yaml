apiVersion: testworkflows.testkube.io/v1
kind: TestWorkflow
metadata:
  name: integration   # overwritten to "<app-name>-<test-name>" at apply time - see
                       # docs/user/cicd-yaml-reference.md's `test:` section in
                       # platform-cicd for why this can't be relied on as-written.
spec:
  container:
    image: curlimages/curl:8.10.1
    env:
      - name: SLACK_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: __APP_SECRETS_NAME__   # substituted for this app's real secret name
                                          # in Testkube's shared namespace at apply time
            key: slack-webhook-url
            optional: true
  steps:
    - name: verify-secret-materialization
      shell: |
        if [ -z "${SLACK_WEBHOOK_URL}" ]; then
          echo "warn: SLACK_WEBHOOK_URL empty - app-secrets may not have this key set yet"
        else
          echo "secret materialized ok (length ${#SLACK_WEBHOOK_URL})"
        fi
        echo "checkout-api integration smoke test - passed"